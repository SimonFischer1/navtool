<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin · NavTool</title>
  <meta name="theme-color" content="#05090c">
  <link rel="icon" type="image/png" href="/pic/allgemein/icon-192.png">
  <link rel="stylesheet" href="/assets/navtool-global.css">
  <style>
    body { margin:0; }
    .admin-shell {
      width: min(1180px, calc(100% - 30px));
      margin: 0 auto;
      padding: 42px 0 60px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      border: 1px solid rgba(85,229,209,.18);
      background: rgba(10,21,27,.8);
      border-radius: 18px;
      margin-bottom: 26px;
    }
    .brandline { display: flex; align-items: center; gap: 12px; }
    .brandline img { height: 26px; }
    .brandline h1 { margin:0; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; }
    .topbar-actions { display:flex; align-items:center; gap:10px; }
    .ghost-button {
      padding: 9px 12px; border:1px solid rgba(85,229,209,.2); background:transparent; color:var(--nt-teal);
      border-radius: 999px; font-size: 9px; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
    }
    .logout-button {
      padding: 9px 12px; border:1px solid rgba(255,112,112,.2); background:rgba(255,112,112,.08); color:#ff9b9b; border-radius:999px;
      font-size: 9px; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
    }
    .login-wrap {
      max-width: 500px; margin: 80px auto 20px; padding: 28px; border-radius: 24px; border:1px solid rgba(85,229,209,.18); background: rgba(10,21,27,.88); box-shadow: 0 20px 50px rgba(0,0,0,.16);
    }
    .login-wrap h2 { margin:0 0 16px; font-size: clamp(28px, 5vw, 46px); letter-spacing:-.05em; }
    .login-form { display:grid; gap:12px; }
    .login-form input, .login-form select {
      width: 100%; border: 1px solid rgba(85,229,209,.18); background: rgba(5,9,12,.9); color: var(--nt-text); border-radius: 12px; padding: 12px 14px; font-size: 15px;
    }
    .login-form button {
      border:0; background: var(--nt-teal); color:#03211d; border-radius: 12px; min-height:48px; font-weight:900; letter-spacing:.12em; text-transform: uppercase; cursor:pointer;
    }
    .login-message { min-height: 22px; color: #ff9b9b; font-size: 13px; }
    .dashboard { display:none; }
    .dashboard.active { display:block; }
    .summary-grid {
      display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:14px; margin-bottom: 20px;
    }
    .summary-card {
      border:1px solid rgba(85,229,209,.14); border-radius:18px; padding:18px; background: rgba(10,21,27,.82);
    }
    .summary-card .label { color: var(--nt-muted-2); font-size:10px; letter-spacing:.16em; font-weight:900; text-transform:uppercase; }
    .summary-card .value { margin-top:8px; font-size: 28px; font-weight:950; letter-spacing:-.04em; }
    .panel-grid { display:grid; grid-template-columns: 1.1fr .9fr; gap:18px; }
    .panel { border:1px solid rgba(85,229,209,.14); background: rgba(10,21,27,.82); border-radius:20px; padding:20px; }
    .panel h3 { margin:0 0 14px; font-size: 18px; letter-spacing: -.02em; }
    .list { display:grid; gap:10px; }
    .module-row {
      display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border:1px solid rgba(85,229,209,.12); border-radius: 12px; background: rgba(5,9,12,.38);
    }
    .toggle-row { display:flex; align-items:center; gap:12px; }
    .switch { position:relative; width:46px; height:26px; border-radius:999px; background: rgba(126,150,151,.34); }
    .switch input { position:absolute; opacity:0; inset:0; }
    .switch .slider { position:absolute; inset: 3px; border-radius:999px; background: rgba(255,255,255,.12); }
    .switch .slider::before { content:''; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:white; transition: transform .2s ease; }
    .switch input:checked + .slider { background: rgba(85,229,209,.5); }
    .switch input:checked + .slider::before { transform: translateX(20px); }
    .status-select { border:1px solid rgba(85,229,209,.18); background: rgba(5,9,12,.8); color:var(--nt-text); border-radius:10px; padding:8px 10px; }
    .stat-list { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
    .stat-list li { display:flex; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid rgba(85,229,209,.08); }
    .stat-list li:last-child { border-bottom: 0; }
    .save-button {
      margin-top: 18px; border:0; background: var(--nt-teal); color:#03211d; border-radius: 12px; min-height:46px; padding: 0 16px; font-weight:900; letter-spacing:.12em; text-transform: uppercase; cursor:pointer;
    }
    .mini-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
    .mini-card { border:1px solid rgba(85,229,209,.12); border-radius: 12px; padding:12px; background: rgba(5,9,12,.38); }
    .mini-card strong { display:block; font-size:20px; margin-top:8px; }
    .small-label { color:var(--nt-muted-2); font-size:10px; letter-spacing:.12em; text-transform: uppercase; font-weight:900; }
    @media (max-width: 820px) { .summary-grid, .panel-grid, .mini-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div id="loginView">
      <div class="login-wrap">
        <div class="brandline" style="margin-bottom:16px;">
          <img src="/pic/allgemein/logo.png" alt="NavTool">
        </div>
        <h2>Admin Login</h2>
        <form class="login-form" id="loginForm">
          <input id="user" type="text" value="Simon" aria-label="Benutzername" placeholder="Benutzername" autocomplete="username">
          <input id="pass" type="password" value="Sfischer111!" aria-label="Passwort" placeholder="Passwort" autocomplete="current-password">
          <button type="submit">Anmelden</button>
        </form>
        <div class="login-message" id="loginMessage"></div>
      </div>
    </div>

    <div id="dashboardView" class="dashboard">
      <div class="topbar">
        <div class="brandline">
          <img src="/pic/allgemein/logo.png" alt="NavTool">
          <h1>NavTool Admin</h1>
        </div>
        <div class="topbar-actions">
          <button class="ghost-button" type="button" onclick="location.href='/status/'">Status</button>
          <button class="logout-button" type="button" id="logoutBtn">Abmelden</button>
        </div>
      </div>

      <div class="summary-grid" id="summaryGrid"></div>

      <div class="panel-grid">
        <div class="panel">
          <h3>Website-Status</h3>
          <div id="moduleList" class="list"></div>
          <button class="save-button" type="button" id="saveModules">Änderungen speichern</button>
        </div>

        <div class="panel">
          <h3>Allgemeine Einstellungen</h3>
          <div class="mini-grid">
            <div class="mini-card">
              <div class="small-label">Akzentfarbe</div>
              <input id="brandColor" type="color" value="#55e5d1" style="width:100%;margin-top:12px;height:42px;border:none;background:transparent;">
            </div>
            <div class="mini-card">
              <div class="small-label">Footer</div>
              <input id="brandFooter" type="text" value="Maritime Navigation Workspace · navtool.de" style="width:100%;margin-top:12px;padding:10px;border:1px solid rgba(85,229,209,.18);border-radius:10px;background:rgba(5,9,12,.8);color:var(--nt-text);">
            </div>
          </div>
          <div class="mini-grid" style="margin-top:12px;">
            <div class="mini-card">
              <div class="small-label">App-Logo</div>
              <input id="logoPath" type="text" value="/pic/allgemein/logo.png" style="width:100%;margin-top:12px;padding:10px;border:1px solid rgba(85,229,209,.18);border-radius:10px;background:rgba(5,9,12,.8);color:var(--nt-text);">
            </div>
            <div class="mini-card">
              <div class="small-label">App-Icon</div>
              <input id="iconPath" type="text" value="/pic/allgemein/icon-192.png" style="width:100%;margin-top:12px;padding:10px;border:1px solid rgba(85,229,209,.18);border-radius:10px;background:rgba(5,9,12,.8);color:var(--nt-text);">
            </div>
          </div>
          <button class="save-button" type="button" id="saveBrand">Einstellungen speichern</button>
        </div>
      </div>

      <div class="panel" style="margin-top:18px;">
        <h3>Analytics</h3>
        <ul class="stat-list" id="statsList"></ul>
      </div>
    </div>
  </div>

  <script>
    const AUTH = { user: 'Simon', pass: 'Sfischer111!' };
    const STORAGE = {
      cfg: 'nt-cfg',
      admin: 'nt-admin',
      stats: 'nt-stats',
      visits: 'nt-visits'
    };

    const $ = (id) => document.getElementById(id);

    function defaultConfig() {
      return {
        updated: new Date().toISOString(),
        brand: { accent: '#55e5d1', footer: 'Maritime Navigation Workspace · navtool.de', logoVersion: 1 },
        app: { version: '2.1', splashSeconds: 3, tabs: { home: true, favorites: true, profile: true } },
        modules: [
          { id: 'map', name: 'MAP', path: '/map/', enabled: true, status: 'aktiv', note: '' },
          { id: 'navtext', name: 'NAVTEXT', path: '/navtext/', enabled: true, status: 'aktiv', note: '' },
          { id: 'colreg', name: 'COLREG', path: '/colreg/', enabled: true, status: 'aktiv', note: '' },
          { id: 'weather', name: 'WEATHER', path: '/weather/', enabled: true, status: 'aktiv', note: '' },
          { id: 'calc', name: 'CALC', path: '/calc/', enabled: true, status: 'aktiv', note: '' },
          { id: 'simulator', name: 'SIMULATOR', path: '/simulator/', enabled: true, status: 'aktiv', note: '' },
          { id: 'app', name: 'APP', path: '/app/', enabled: true, status: 'aktiv', note: '' }
        ]
      };
    }

    function loadConfig() {
      try {
        const saved = localStorage.getItem(STORAGE.cfg);
        if (saved) return JSON.parse(saved);
      } catch (_) {}
      return defaultConfig();
    }

    function saveConfig(cfg) {
      localStorage.setItem(STORAGE.cfg, JSON.stringify(cfg));
    }

    function readStats() {
      const stats = JSON.parse(localStorage.getItem(STORAGE.stats) || '{}');
      const visits = JSON.parse(localStorage.getItem(STORAGE.visits) || '{}');
      return { stats, visits };
    }

    function updateStatsUI() {
      const { stats, visits } = readStats();
      const items = [
        ['Heute', visits.today || 0],
        ['Monat', visits.month || 0],
        ['Jahr', visits.year || 0],
        ['Downloads', stats.downloads || 0],
        ['Referrer', stats.referrer || 'Direkt'],
        ['Letztes Update', stats.lastUpdate || '–']
      ];
      $('statsList').innerHTML = items.map(([label, value]) => `<li><span>${label}</span><strong>${value}</strong></li>`).join('');
    }

    function renderSummary(cfg) {
      const modules = cfg.modules || [];
      const active = modules.filter(m => m.enabled && m.status === 'aktiv').length;
      const warning = modules.filter(m => m.enabled && (m.status === 'wartung' || m.status === 'planung')).length;
      const disabled = modules.filter(m => !m.enabled || m.status === 'aus').length;
      const cards = [
        { label: 'Aktiv', value: active },
        { label: 'Wartung', value: warning },
        { label: 'Ausgeschaltet', value: disabled },
        { label: 'Gesamt', value: modules.length }
      ];
      $('summaryGrid').innerHTML = cards.map(c => `
        <div class="summary-card">
          <div class="label">${c.label}</div>
          <div class="value">${c.value}</div>
        </div>
      `).join('');
    }

    function renderModules(cfg) {
      const list = $('moduleList');
      list.innerHTML = (cfg.modules || []).map((module) => `
        <div class="module-row">
          <div>
            <strong>${module.name || module.id}</strong>
            <div style="font-size:12px;color:var(--nt-muted);margin-top:5px;">${module.path || '/'}</div>
          </div>
          <div class="toggle-row">
            <label class="switch" aria-label="Modul aktiv">
              <input type="checkbox" ${module.enabled !== false ? 'checked' : ''} data-module-id="${module.id}">
              <span class="slider"></span>
            </label>
            <select class="status-select" data-status-id="${module.id}">
              <option value="aktiv" ${module.status === 'aktiv' ? 'selected' : ''}>Aktiv</option>
              <option value="wartung" ${module.status === 'wartung' ? 'selected' : ''}>Wartung</option>
              <option value="planung" ${module.status === 'planung' ? 'selected' : ''}>Planung</option>
              <option value="stoerung" ${module.status === 'stoerung' ? 'selected' : ''}>Störung</option>
              <option value="aus" ${module.status === 'aus' ? 'selected' : ''}>Aus</option>
            </select>
          </div>
        </div>
      `).join('');
    }

    function applyBrandToPage() {
      const cfg = loadConfig();
      const accent = (cfg.brand && cfg.brand.accent) || '#55e5d1';
      document.documentElement.style.setProperty('--nt-teal', accent);
      const footer = (cfg.brand && cfg.brand.footer) || 'Maritime Navigation Workspace · navtool.de';
      $('brandColor').value = accent;
      $('brandFooter').value = footer;
      $('logoPath').value = '/pic/allgemein/logo.png';
      $('iconPath').value = '/pic/allgemein/icon-192.png';
    }

    function showDashboard() {
      const cfg = loadConfig();
      renderSummary(cfg);
      renderModules(cfg);
      updateStatsUI();
      applyBrandToPage();
      $('dashboardView').classList.add('active');
      $('loginView').style.display = 'none';
    }

    function showLogin() {
      $('dashboardView').classList.remove('active');
      $('loginView').style.display = 'block';
    }

    function loginUser(event) {
      event.preventDefault();
      const user = $('user').value.trim();
      const pass = $('pass').value;
      if (user === AUTH.user && pass === AUTH.pass) {
        localStorage.setItem(STORAGE.admin, '1');
        $('loginMessage').textContent = '';
        showDashboard();
      } else {
        $('loginMessage').textContent = 'Benutzername oder Passwort falsch.';
      }
    }

    function saveModules() {
      const cfg = loadConfig();
      document.querySelectorAll('[data-module-id]').forEach((toggle) => {
        const id = toggle.dataset.moduleId;
        const module = cfg.modules.find((m) => m.id === id);
        if (module) module.enabled = toggle.checked;
      });
      document.querySelectorAll('[data-status-id]').forEach((select) => {
        const id = select.dataset.statusId;
        const module = cfg.modules.find((m) => m.id === id);
        if (module) module.status = select.value;
      });
      cfg.updated = new Date().toISOString();
      saveConfig(cfg);
      renderSummary(cfg);
      renderModules(cfg);
      updateStatsUI();
    }

    function saveBrand() {
      const cfg = loadConfig();
      cfg.brand = cfg.brand || {};
      cfg.brand.accent = $('brandColor').value;
      cfg.brand.footer = $('brandFooter').value.trim() || 'Maritime Navigation Workspace · navtool.de';
      cfg.updated = new Date().toISOString();
      saveConfig(cfg);
      applyBrandToPage();
      document.documentElement.style.setProperty('--nt-teal', cfg.brand.accent);
      updateStatsUI();
    }

    $('loginForm').addEventListener('submit', loginUser);
    $('saveModules').addEventListener('click', saveModules);
    $('saveBrand').addEventListener('click', saveBrand);
    $('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE.admin);
      showLogin();
    });

    if (localStorage.getItem(STORAGE.admin) === '1') {
      showDashboard();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
