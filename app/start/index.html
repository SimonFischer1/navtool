<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NavTool">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>NavTool</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="shell">
  <header class="bar">
    <div class="brand"><span class="mk">NT</span><b>NAVTOOL</b></div>
    <button id="net" class="pill" type="button" aria-live="polite"><i></i><span>Prüfe…</span></button>
  </header>

  <main id="views">
    <section id="v-start" class="view on">
      <div id="resume"></div>
      <h1>Werkzeuge</h1>
      <div class="grid" id="grid"></div>
    </section>

    <section id="v-search" class="view">
      <h1>Suche</h1>
      <input id="q" type="search" placeholder="z. B. Schallsignal, Wolken, Kompass, NAVTEX…" autocomplete="off">
      <div id="results" class="list"></div>
    </section>

    <section id="v-offline" class="view">
      <h1>Offline</h1>
      <div class="panel">
        <h2 id="offTitle">Offline-Status</h2>
        <p id="offText" class="mute">Wird geprüft…</p>
        <div class="meter"><i id="meterBar"></i></div>
        <button id="prep" class="btn" type="button">Offline-Paket laden</button>
      </div>
      <div class="panel">
        <h2>Was geht ohne Netz?</h2>
        <ul class="kv" id="offList"></ul>
      </div>
      <div class="panel">
        <h2>Auf iPhone &amp; iPad installieren</h2>
        <ol class="steps">
          <li>Diese Seite in <b>Safari</b> öffnen.</li>
          <li>Teilen-Symbol antippen, dann <b>„Zum Home-Bildschirm“</b>.</li>
          <li>App einmal mit Internet öffnen und hier „Offline-Paket laden“ tippen.</li>
        </ol>
      </div>
    </section>
  </main>

  <nav class="tabs" aria-label="Hauptnavigation">
    <button data-v="start" class="on" type="button"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Start</button>
    <button data-v="search" type="button"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg>Suche</button>
    <button data-v="offline" type="button"><svg viewBox="0 0 24 24"><path d="M12 4v10m0 0l-4-4m4 4l4-4M5 19h14"/></svg>Offline</button>
  </nav>
</div>

<div id="viewer" hidden>
  <header class="vbar">
    <button id="back" type="button" aria-label="Zurück zur Startseite">‹ Start</button>
    <b id="vtitle"></b>
    <button id="reload" type="button" aria-label="Neu laden">↻</button>
  </header>
  <iframe id="frame" title="Werkzeug"></iframe>
</div>
<script src="app.js"></script>
</body>
</html>
