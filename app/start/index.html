<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NavTool">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/icons/icon-192.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>NAVTOOL</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="shell">
  <header class="brand">
    <div class="bm">N</div>
    <div class="bt"><b>NAVTOOL</b><small>MARITIME WORKSPACE</small></div>
    <button id="net" class="pill" type="button"><i></i><span>Prüfe…</span></button>
  </header>

  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
    <input id="q" type="search" placeholder="Werkzeug oder Thema suchen …" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Suche">
  </label>

  <main class="tiles">
    <div class="grid" id="grid"></div>
    <p class="none" id="none" hidden>Nichts gefunden. Versuche „KVR“, „Wolken“ oder „Kompass“.</p>
  </main>

  <section class="off" aria-labelledby="offT">
    <div class="off-top">
      <div><h2 id="offT">Offline-Nutzung</h2><p id="offText">Wird geprüft…</p></div>
      <span class="state" id="state">–</span>
    </div>
    <div class="meter"><i id="bar"></i></div>
    <button id="prep" class="btn" type="button">Offline-Paket laden</button>
    <small id="stamp"></small>
    <details><summary>Was funktioniert ohne Netz?</summary><ul id="offList"></ul></details>
    <a id="inst" class="inst" href="/app/" hidden>App auf dem Home-Bildschirm installieren →</a>
  </section>
</div>

<div id="viewer" hidden>
  <header class="vbar">
    <button id="back" type="button" aria-label="Zurück zur Startseite">‹ Start</button>
    <b id="vtitle"></b>
    <button id="reload" type="button" aria-label="Neu laden">↻</button>
  </header>
  <iframe id="frame" title="Werkzeug"></iframe>
</div>
<script src="app.js"></script>
</body>
</html>
