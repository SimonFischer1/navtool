<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NavTool · Rechenblatt für Navigation und Schiffstheorie</title>
<style>
:root{
  --paper:#05090c;
  --paper-soft:#0a141b;
  --panel:rgba(10,21,27,.82);
  --panel-strong:rgba(12,27,34,.96);
  --ink:#ecfbf9;
  --mute:#7e9697;
  --line:rgba(85,229,209,.14);
  --line-strong:rgba(85,229,209,.32);
  --green:#55e5d1;
  --green-strong:#1eb9a8;
  --ong:#03211d;
  --mag:#ff7f7f;
  --bg-grid:rgba(85,229,209,.025);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;background:var(--paper)}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%, rgba(85,229,209,.08), transparent 24%),
    radial-gradient(circle at 82% 18%, rgba(103,223,255,.05), transparent 26%),
    var(--paper);
  color:var(--ink);
  font:400 16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
body::before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:44px 44px;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{
  background:rgba(5,9,12,.86);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  color:var(--ink);
  padding:0 max(20px,calc((100% - 1240px)/2));
  position:sticky; top:0; z-index:50;
}
.top .inner{
  min-height:76px;
  display:flex; align-items:center; justify-content:space-between; gap:18px;
}
.top .brand{
  display:flex; align-items:center; gap:12px;
  font-weight:900; letter-spacing:.12em; text-transform:uppercase; font-size:12px;
  text-decoration:none;
}
.top .brand-mark{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  background: rgba(85,229,209,.08); border:1px solid var(--line-strong); color:var(--green);
  font-size:18px; font-weight:900;
}
.top nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.top nav a{
  text-decoration:none; color:#9ab1b1; font-size:10px; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
  padding:9px 11px; border:1px solid transparent; border-radius:8px;
}
.top nav a:hover,.top nav a.on{color:var(--green);background:rgba(85,229,209,.05);border-color:var(--line)}
.top .status{
  display:inline-flex; align-items:center; gap:8px;
  padding:7px 10px; border:1px solid var(--line-strong); border-radius:999px; background:rgba(10,21,27,.8);
  color:var(--mute); font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
}
.top .status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);gap:48px;width:min(1240px,calc(100% - 32px));margin:0 auto;padding:34px 20px 20px}
aside{position:sticky;top:100px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;padding-right:6px}
.logo{font:900 22px/1.2 Inter,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:0 0 8px}
.tag{color:var(--mute);font-size:12.5px;line-height:1.5;margin:0 0 18px}
#q{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(10,21,27,.9);color:var(--ink);font:inherit}
#q:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(85,229,209,.08)}
#idx h2{font:800 11px/1.2 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:24px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
#idx ul{list-style:none}
#idx button{width:100%;text-align:left;padding:10px 12px;border:0;border-left:3px solid transparent;background:transparent;color:var(--ink);font:inherit;cursor:pointer;border-radius:10px}
#idx button span{display:block;font-weight:700}
#idx button small{display:block;color:var(--mute);font-size:12.5px;line-height:1.5}
#idx button:hover{background:rgba(85,229,209,.05)}
#idx button.on{background:rgba(85,229,209,.08);color:var(--ink);border-left-color:var(--green)}
#idx button.on small{color:#d9efec}
#idx button.soon{opacity:.45;font-style:italic;cursor:default;background:transparent}
.tg{display:none}
.cart{
  border:1px solid var(--line-strong);border-radius:18px;margin:6px 6px 30px;padding:24px 120px 24px 22px;background:linear-gradient(180deg,rgba(13,27,34,.96),rgba(10,21,27,.88));
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}
.cart small{color:var(--green);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.cart h1{font:950 clamp(32px,4vw,50px)/1.02 Inter,system-ui,sans-serif;letter-spacing:-.055em;margin:10px 0 14px}
.cart p{color:var(--mute);font-size:14px;line-height:1.7}
.tool{display:none}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px 24px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;color:#c4d9d5}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(10,21,27,.9);color:var(--ink);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(85,229,209,.08)}
.go{margin-top:26px;padding:13px 24px;border:0;border-radius:12px;background:var(--green);color:#03211d;font:900 14px Inter,system-ui,sans-serif;cursor:pointer;letter-spacing:.1em;text-transform:uppercase}
.go:hover{background:#bffaf1}
.go.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-right:10px}
.go.ghost:hover{border-color:var(--green);background:rgba(85,229,209,.04)}
.res{margin-top:28px;padding:16px 18px;border:1px solid var(--line);border-left:4px solid var(--green);border-radius:14px;background:rgba(10,21,27,.8);color:var(--mute);min-height:58px;display:flow-root}
.res>:first-child{margin-top:0}
.r{display:flex;align-items:baseline;gap:12px;padding:11px 0;color:var(--ink);border-bottom:1px dotted rgba(223,238,234,.18)}
.r:last-of-type{border-bottom:0}
.r span{color:var(--mute);font-size:14px}
.r strong{margin-left:auto;font:800 22px/1.2 Inter,system-ui,sans-serif;font-variant-numeric:lining-nums tabular-nums;text-align:right;color:var(--green)}
.res .err{color:var(--mag);font-weight:700}
.res .note{margin-top:10px}
.note{color:var(--mute);font-size:13px;line-height:1.6;margin-top:14px;max-width:72ch}
.tw{overflow-x:auto;margin-bottom:8px}
table{border-collapse:collapse;width:100%;min-width:780px}
th{text-align:left;font-size:12.5px;color:var(--mute);padding:0 6px 4px}
td{padding:6px 3px}td input{padding:8px}
.x{border:0;background:transparent;color:var(--mag);font-size:22px;cursor:pointer}
footer.nt-foot{margin-top:42px;border-top:1px solid var(--line);background:#030708;color:var(--ink)}
footer.nt-foot .nt-foot-in{width:min(1280px,calc(100% - 32px));margin:0 auto;padding:26px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:30px}
footer.nt-foot .nt-foot-in img{height:22px;display:block}
footer.nt-foot .nt-foot-copy{color:#587071;font-size:11px;margin-top:8px}
footer.nt-foot .nt-foot-links{display:flex;flex-wrap:wrap;gap:6px 16px}
footer.nt-foot .nt-foot-links a{color:#71898a;text-decoration:none;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:6px 0}
footer.nt-foot .nt-foot-links a:hover{color:var(--green)}
@media(max-width:860px){
  .app{grid-template-columns:1fr;gap:24px;padding-top:22px}
  aside{position:static;max-height:none;overflow:visible}
  .tg{display:block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--green);font:900 14px Inter,system-ui,sans-serif;text-align:left;color:#03211d;cursor:pointer;letter-spacing:.1em;text-transform:uppercase}
  #q,#idx{display:none}
  aside.open #q,aside.open #idx{display:block}
  .cart{padding-right:22px;background-image:none}
  .top .inner{min-height:70px}
  .top nav{display:none}
}
</style>
<link rel="stylesheet" href="../assets/navtool-global.css">
<link rel="icon" type="image/png" href="/pic/allgemein/icon-192.png"><link rel="apple-touch-icon" href="/pic/allgemein/icon-180.png"></head>
<body>
<div class="top">
  <div class="inner">
    <a class="brand" href="/" aria-label="NavTool Startseite">
      <span class="brand-mark">N</span>
      <span>NAVTOOL</span>
    </a>
    <nav aria-label="Hauptnavigation">
      <a href="/map/" class="on">Map</a>
      <a href="/navtext/">Navtext</a>
      <a href="/colreg/">Colreg</a>
      <a href="/weather/">Weather</a>
      <a href="/calc/">Calc</a>
      <a href="/simulator/">Simulator</a>
      <a href="/status/">Status</a>
    </nav>
    <div class="status"><i></i> Online</div>
  </div>
</div>
<div class="app">
<aside id="side">
  <div class="logo">Rechenblatt</div>
  <p class="tag">Navigation, Kompass und Schiffstheorie</p>
  <button class="tg" id="tg" type="button">Rechner wählen ▾</button>
  <input id="q" placeholder="Rechner suchen" aria-label="Rechner suchen">
  <div id="idx"></div>
</aside>
<main id="sheet"></main>
</div>

<script>
const $=id=>document.getElementById(id), n=v=>parseFloat(v), f=(v,d=2)=>v.toFixed(d).replace('.',',');
const CATS={nav:'Navigation',kompass:'Kompass',theorie:'Schiffstheorie'};
const dirs=(a,b)=>['s',a,[a,b]];
const pos=(g,m,d)=>{const x=n(g)+n(m)/60;return d==='S'||d==='W'?-x:x};
const bad=t=>`<span class="err">${t}</span>`;
const norm=a=>((a%360)+360)%360;

/* Felder: [id, Label, Typ(n|t|dt|s), Optionen/Default] */
const signed=x=>((x+180)%360+360)%360-180;
function solarAz(date,lat,lon){const rad=Math.PI/180,jd=date.getTime()/86400000+2440587.5,T=(jd-2451545)/36525;
const L0=norm(280.46646+T*(36000.76983+T*0.0003032)),M=norm(357.52911+T*(35999.05029-0.0001537*T));
const C=Math.sin(M*rad)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*M*rad)*(0.019993-0.000101*T)+Math.sin(3*M*rad)*0.000289;
const om=125.04-1934.136*T,lam=L0+C-0.00569-0.00478*Math.sin(om*rad),eps=23.439291-0.0130042*T+0.00256*Math.cos(om*rad);
const x=Math.cos(lam*rad)*Math.cos(eps*rad),y=Math.sin(lam*rad)*Math.cos(eps*rad),z=Math.sin(eps*rad),
az=(Math.atan2(y,x)*180/Math.PI+360)%360;
const dec=Math.atan2(z,Math.sqrt(x*x+y*y))*180/Math.PI;
const H=(date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600+lon/15)-12;
const latr=lat*rad;
const alt=Math.asin(Math.sin(latr)*Math.sin(dec*rad)+Math.cos(latr)*Math.cos(dec*rad)*Math.cos(H*15*rad));
return (az+180)%360;
}
const variants={
  'b-a':{title:'Besteckrechnung',desc:'Mittlere Distanz, rwk',cat:'nav',f:[['latA','Breite A – Grad','n',0],['latAm','Breite A – Minuten','n',0],['lonA','Länge A – Grad','n',0],['lonAm','Länge A – Minuten','n',0],['latB','Breite B – Grad','n',0],['latBm','Breite B – Minuten','n',0],['lonB','Länge B – Grad','n',0],['lonBm','Länge B – Minuten','n',0],['dir','Richtung','n',0],['dist','Distanz','n',0]],run:(d)=>{const a={la:pos(d.latA,d.latAm,'N'),lo:pos(d.lonA,d.lonAm,'E')},b={la:pos(d.latB,d.latBm,'N'),lo:pos(d.lonB,d.lonBm,'E')};const dx=(b.lo-a.lo)*Math.cos((a.la+b.la)/2*Math.PI/180),dy=(b.la-a.la);const dist=Math.hypot(dx,dy)*60;const dir=(Math.atan2(dx,dy)*180/Math.PI+360)%360;return {dist:dist,dir:dir};}},
  'gk':{title:'Großkreisnavigation',desc:'Distanz & Anfangskurs',cat:'nav',f:[['lat1','Breite 1 – Grad','n',0],['lat1m','Breite 1 – Minuten','n',0],['lon1','Länge 1 – Grad','n',0],['lon1m','Länge 1 – Minuten','n',0],['lat2','Breite 2 – Grad','n',0],['lat2m','Breite 2 – Minuten','n',0],['lon2','Länge 2 – Grad','n',0],['lon2m','Länge 2 – Minuten','n',0]],run:(d)=>{const p1={lat:pos(d.lat1,d.lat1m,'N'),lon:pos(d.lon1,d.lon1m,'E')};const p2={lat:pos(d.lat2,d.lat2m,'N'),lon:pos(d.lon2,d.lon2m,'E')};const R=3440.065;const a1=p1.lat*Math.PI/180,a2=p2.lat*Math.PI/180,dl=(p2.lon-p1.lon)*Math.PI/180;const a=Math.acos(Math.sin(a1)*Math.sin(a2)+Math.cos(a1)*Math.cos(a2)*Math.cos(dl));const c=Math.atan2(Math.sin(dl)*Math.cos(a2),Math.cos(a1)*Math.sin(a2)-Math.sin(a1)*Math.cos(a2)*Math.cos(dl));return {dist:R*a,dir:(c*180/Math.PI+360)%360};}},
  'sr':{title:'Stromdreck',desc:'KÜG & FÜG',cat:'nav',f:[['v','Geschwindigkeit – kn','n',0],['crs','Kurs – °','n',0],['set','Stromsetzung – °','n',0],['drift','Stromdrift – kn','n',0]],run:(d)=>{const v=n(d.v),c=n(d.crs),s=n(d.set),dr=n(d.drift);const rad=Math.PI/180;const x=v*Math.sin(c*rad)+dr*Math.sin(s*rad),y=v*Math.cos(c*rad)+dr*Math.cos(s*rad);return {dist:Math.hypot(x,y),dir:(Math.atan2(x,y)*180/Math.PI+360)%360};}},
  'kp':{title:'Koppelnavigation',desc:'Fahrt · Weg · ETA',cat:'nav',f:[['spd','Geschwindigkeit – kn','n',0],['hdg','Kurs – °','n',0],['dist','Strecke – sm','n',0],['time','Zeit – h','n',0]],run:(d)=>{const v=n(d.spd),c=n(d.hdg),s=n(d.dist),h=n(d.time)||0;const x=v*Math.sin(c*Math.PI/180);const y=v*Math.cos(c*Math.PI/180);return {dist:s,dir:(Math.atan2(x,y)*180/Math.PI+360)%360};}},
  'utc':{title:'UTC-Rechner',desc:'Ortszeit → UTC',cat:'nav',f:[['tz','Zeitzone – h','n',0],['time','Uhrzeit','t','12:00'],['date','Datum','t','2025-01-01']],run:(d)=>{const [h,m]=String(d.time).split(':').map(Number);const date=new Date(d.date+'T00:00:00Z');date.setUTCHours((h||0)-(n(d.tz)||0),m||0,0,0);return {text:date.toISOString().slice(11,16)+' UTC'} }},
  'fc':{title:'Feuer in der Kimm',desc:'Sichtweite berechnen',cat:'nav',f:[['h','Augeshöhe – m','n',1],['he','Leuchtturmhöhe – m','n',20]],run:(d)=>{const h=n(d.h),H=n(d.he);const D=Math.sqrt(2*H)+Math.sqrt(2*h);return {dist:D};}},
  'gz':{title:'Gezeiten',desc:'Zweifeltregel',cat:'theorie',f:[['t','Zeitpunkt – h','n',0],['a','Amplitude','n',0],['p','Periode','n',0]],run:(d)=>{const t=n(d.t),A=n(d.a),P=n(d.p);return {val:(A*Math.sin((2*Math.PI/P)*(t)))};}},
  'rh':{title:'Radarhorizont',desc:'Reichweite nach Antennehöhe',cat:'theorie',f:[['h','Antennehöhe – m','n',0]],run:(d)=>{const h=n(d.h);return {dist:Math.sqrt(2*h*6371/1000)*1.852};}},
  'comp':{title:'Kompass',desc:'Deviation, Missweisung, Gyro Error',cat:'kompass',f:[['true','True Course – °','n',0],['var','Missweisung – °','n',0],['dev','Deviation – °','n',0],['gyro','Gyro Error – °','n',0]],run:(d)=>{const T=n(d.true),V=n(d.var),D=n(d.dev),G=n(d.gyro);const mag=T+V+D;const gyro=(T+G); return {mag:mag,gyro:gyro};}},
  'az':{title:'Sonnenazimut',desc:'Azimut / Höhe',cat:'kompass',f:[['lat','Latitude – °','n',0],['lon','Longitude – °','n',0],['day','Tag','n',1],['month','Monat','n',1],['year','Jahr','n',2025]],run:(d)=>{const lat=n(d.lat),lon=n(d.lon);const date=new Date(n(d.year),n(d.month)-1,n(d.day));const az=solarAz(date,lat,lon);return {dir:az};}}
};
const list=[['b-a','Besteckrechnung','Navigation, Kompass und Schiffstheorie'],['gk','Großkreisnavigation','Distanz & Anfangskurs'],['sr','Stromdreck','KÜG & FÜG'],['kp','Koppelnavigation','Fahrt · Weg · ETA'],['utc','UTC-Rechner','Ortszeit → UTC'],['fc','Feuer in der Kimm','Sichtweite berechnen'],['gz','Gezeiten','Zweifeltregel'],['rh','Radarhorizont','Reichweite nach Antennehöhe'],['comp','Kompass','Deviation, Missweisung, Gyro Error'],['az','Sonnenazimut','Azimut / Höhe']];
const tools=Object.fromEntries(list.map(([id,title,desc])=>[id,{id,title,desc}]));
const $list=$('#idx');
function renderIndex(){
  const html=['<h2>Navigation</h2>'];
  list.forEach(([id,title,desc])=>html.push(`<button type="button" data-id="${id}" class="${(window._sel||'b-a')===id?'on':''}"><span>${title}</span><small>${desc}</small></button>`));
  $list.innerHTML=html.join('');
  $list.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{window._sel=btn.dataset.id;render();renderIndex();});
}
function render(){
  const id=window._sel||'b-a';
  const v=variants[id];
  if(!v)return;
  const title=v.title,desc=v.desc;
  const fields=v.f;
  const body=`<div class="cart"><small>Navigation</small><h1>${title}</h1><p>${desc}</p></div><div class="tool"><div class="fg">${fields.map(([k,label,type,defaultV])=>`<div><label>${label}</label><input id="${k}" type="${type==='t'?'text':'number'}" value="${defaultV||''}"${type==='t'?'':' step="any"'}></div>`).join('')}</div><div style="display:flex;flex-wrap:wrap;gap:10px"><button class="go ghost" type="button" id="clear">Zurücksetzen</button><button class="go" type="button" id="calc">Berechnen</button></div><div class="res" id="result">Ergebnis erscheint hier.</div></div>`;
  $('#sheet').innerHTML=body;
  $('#clear').onclick=()=>{
    fields.forEach(([k])=>{const el=document.getElementById(k);if(el)el.value='';});
    $('#result').innerHTML='Ergebnis erscheint hier.';
  };
  $('#calc').onclick=()=>{
    const vals={};
    fields.forEach(([k,label,type,defaultV])=>{vals[k]=document.getElementById(k).value;});
    const out=v.run(vals);
    let html='';
    if(out && out.text){ html=`<div>${out.text}</div>`; }
    else {
      const entries=[];
      Object.entries(out).forEach(([k,val])=>{ if(k==='dir' || k==='dist' || k==='val' || k==='mag' || k==='gyro'){ entries.push(`<div class="r"><span>${k.toUpperCase()}</span><strong>${f(val,2)}</strong></div>`); } });
      html = entries.join('');
    }
    $('#result').innerHTML=html||'Ergebnis erscheint hier.';
  };
}
window._sel='b-a';
renderIndex();
render();
if(document.getElementById('tg')) document.getElementById('tg').onclick=()=>document.getElementById('side').classList.toggle('open');
</script>
</body>
</html>
