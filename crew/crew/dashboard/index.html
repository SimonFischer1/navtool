<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NavTool - Crew Dashboard</title><link rel="stylesheet" href="../../assets/navtool-global.css"><style>
:root{--bg:#020807;--panel:#071210;--text:#eef7f5;--muted:#91aaa6;--line:rgba(160,220,211,.16);--teal:#00e0c0;--red:#ff5364}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.dash{width:min(1450px,calc(100% - 28px));margin:18px auto;padding:22px}.login{min-height:78vh;display:grid;place-items:center}.login-card,.panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#091a17,#040d0c);box-shadow:0 20px 70px #0008}.login-card{width:min(440px,100%);padding:30px}.login-card h1{font-size:32px;margin:5px 0}.muted{color:var(--muted);line-height:1.55}.field{display:grid;gap:7px;margin:12px 0}.field label{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#06110f;color:var(--text);outline:none}.field textarea{min-height:90px;resize:vertical}.btn{border:1px solid rgba(0,224,192,.3);border-radius:10px;background:#071510;color:var(--text);padding:11px 14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--teal);color:#00100d;border-color:var(--teal)}.btn.danger{border-color:var(--red);color:#ff9aa7}.btn:hover{filter:brightness(1.12)}.hidden{display:none!important}.dash-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:20px}.dash-head h1{margin:5px 0;font-size:clamp(30px,5vw,52px)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:#07110f;color:var(--muted);border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:800;font-size:10px}.tab.active{color:var(--teal);border-color:var(--teal);background:rgba(0,224,192,.08)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{padding:20px}.panel h2{margin:0 0 14px;font-size:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.list{display:grid;gap:9px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid rgba(160,220,211,.1);border-radius:11px;background:rgba(255,255,255,.015)}.row strong{display:block}.row small{display:block;color:var(--muted);margin-top:3px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{padding:4px 7px;border-radius:999px;background:rgba(0,224,192,.08);border:1px solid rgba(0,224,192,.18);font-size:9px;color:#7ce9dc}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:160px;padding:10px;border:1px solid rgba(160,220,211,.12);border-radius:12px;background:#06100f}.day h3{font-size:12px;margin:0 0 9px}.task{padding:8px;margin-bottom:7px;border-left:3px solid var(--teal);background:rgba(0,224,192,.05);border-radius:6px;font-size:10px}.task b{display:block}.notice{padding:11px;border:1px solid rgba(243,201,105,.25);background:rgba(243,201,105,.05);border-radius:10px;color:#f3d995;font-size:11px;line-height:1.6;margin-bottom:16px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{padding:14px;border:1px solid var(--line);border-radius:14px;background:#06110f}.stat b{display:block;font-size:24px;color:var(--teal)}.stat span{color:var(--muted);font-size:10px}.password-note{font-size:10px;color:#8ea9a4;margin-top:5px}@media(max-width:850px){.grid,.form-grid,.stat-grid{grid-template-columns:1fr}.week{grid-template-columns:1fr 1fr}.dash-head{align-items:flex-start;flex-direction:column}}@media(max-width:500px){.week{grid-template-columns:1fr}.dash{width:calc(100% - 10px);padding:10px}}
.reminder{border:1px solid rgba(255,190,80,.35);background:#211807;color:#ffe0a1;padding:12px;border-radius:12px;margin:8px 0}.badge-no{display:inline-grid;place-items:center;min-width:34px;height:34px;border-radius:10px;background:rgba(0,224,192,.12);border:1px solid rgba(0,224,192,.28);color:var(--teal);font-weight:900}.subtle{font-size:11px;color:var(--muted)}.bridge-row{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:8px;align-items:center;margin:7px 0}.bridge-row input{min-width:0;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#06110f;color:var(--text)}.section-note{color:var(--muted);font-size:12px;line-height:1.55}.reminder-list{display:grid;gap:8px}@media(max-width:700px){.bridge-row{grid-template-columns:1fr 1fr}.bridge-row .bridge-remove{grid-column:1/-1}.bridge-row input{width:100%}}</style></head><body><div id="app" class="dash"></div><script src="../../assets/navtool-global.js"></script><script src="../crew-data.js"></script><script>
const STORE=window.NAVTOOL_CREW_STORE;let data=STORE.load();data.jobs=data.jobs||[];data.movements=data.movements||[];data.bridgeLogs=data.bridgeLogs||[];data.settings=data.settings||{shipName:'CUNO ESSBERGER',voyageNumber:''};let active='overview';let editingId=null;const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt=v=>{if(!v)return'—';const d=new Date(v+'T00:00:00');return isNaN(d)?v:d.toLocaleDateString('de-DE')};
function login(){app.innerHTML=`<section class="login"><div class="login-card"><div class="muted" style="letter-spacing:.18em;font-size:10px;font-weight:900">NAVTOOL / CREW ADMIN</div><h1>Kapitän Dashboard</h1><p class="muted">Nur der Kapitän verwaltet Crew-Konten, Berechtigungen, Duties, Anreise, Abreise und Schiffstermine.</p><div class="field"><label>BENUTZERNAME</label><input id="u" autocomplete="username"></div><div class="field"><label>PASSWORT</label><input id="p" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">Anmelden</button><p id="loginErr" class="muted"></p></div></section>`;document.getElementById('loginBtn').onclick=()=>{if(document.getElementById('u').value==='Kapitän'&&document.getElementById('p').value==='Kapitän1'){sessionStorage.setItem('navtool-crew-admin','1');renderApp()}else document.getElementById('loginErr').textContent='Benutzername oder Passwort falsch.'}}
function renderApp(){app.innerHTML=`<div class="dash-head"><div><div class="muted" style="font-size:10px;font-weight:900;letter-spacing:.16em">SHIPBOARD CREW ADMINISTRATION</div><h1>CUNO ESSBERGER</h1><div class="muted">Crew-Konten, Ränge, Kabinen, Berechtigungen, Arbeitszeiten und Hafenereignisse verwalten.</div></div><div class="actions"><a class="btn" href="../">← Crew App</a><button class="btn" id="logout">Abmelden</button></div></div><div class="notice"><b>Admin-Zugang:</b> Nur der Kapitän. Die Auftrags-, Crew-Reise- und Brückenprotokoll-Bereiche sind ergänzt. Ohne eingerichtete Server-API bleiben Daten lokal auf diesem Gerät; für gemeinsame Online-Daten muss die mitgelieferte crew-api auf PHP-Webspace eingerichtet werden.</div><div class="stat-grid"><div class="stat"><b>${data.members.length}</b><span>Konten</span></div><div class="stat"><b>${data.members.filter(m=>m.arrival&&(!m.departure||m.departure>=new Date().toISOString().slice(0,10))).length}</b><span>an Bord / geplant</span></div><div class="stat"><b>${data.tasks.length}</b><span>Duties</span></div><div class="stat"><b>${data.events.length}</b><span>Hafenereignisse</span></div></div><div class="tabs">${[['overview','Übersicht'],['crew','Crew & Konten'],['tasks','Duties / Woche'],['events','Ankunft / Abfahrt'],['jobs','Nächste Aufträge'],['movements','Crew An-/Abreise'],['bridge','Brückenprotokoll']].map(x=>`<button class="tab ${active===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div><div id="view"></div>`;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.tab;editingId=null;renderApp()});document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('navtool-crew-admin');login()};renderView()}
function renderView(){const v=document.getElementById('view');v.innerHTML=active==='overview'?overview():active==='crew'?crewView():active==='tasks'?tasksView():active==='events'?eventsView():active==='jobs'?jobsView():active==='movements'?movementsView():bridgeView();bind()}
function overview(){const due=data.movements.filter(m=>m.status!=='confirmed'&&m.date&&m.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="grid"><article class="panel"><h2>Aktuelle Besatzung</h2><div class="list">${data.members.map(m=>`<div class="row"><div><strong>${esc(m.firstName+' '+m.lastName)}</strong><small>${esc(m.rank||'—')} · Kabine ${esc(m.room||'—')}</small></div><span class="chip">${esc(m.username||'kein Konto')}</span></div>`).join('')||'<span class="muted">Keine Konten.</span>'}</div></article><article class="panel"><h2>Diese Woche</h2><div class="week">${weekDays().map(d=>`<div class="day"><h3>${d.label}</h3>${data.tasks.filter(t=>t.date===d.key).map(t=>`<div class="task"><b>${esc(t.time||'')} · ${esc(t.type)}</b>${esc(t.title)}<br><small>${esc(memberName(t.assignee))}</small></div>`).join('')||'<span class="muted">—</span>'}</div>`).join('')}</div></article><article class="panel"><h2>Erinnerungen: Crew-Reisen</h2><div class="reminder-list">${due.slice(0,8).map(m=>`<div class="reminder"><b>${m.direction==='join'?'Kommt an':'Geht von Bord'} · ${esc(memberName(m.memberId))}</b><div>${fmt(m.date)} · ${esc(m.proposedPlace||'Ort noch offen')}</div><div class="subtle">${m.status==='confirmed'?'Vom Kapitän bestätigt':'Bitte tatsächlichen Ort bestätigen'}</div></div>`).join('')||'<span class="muted">Keine offenen Reisevormerkungen.</span>'}</div></article><article class="panel"><h2>Nächste Aufträge</h2><div class="list">${data.jobs.filter(j=>j.status!=='done').sort((a,b)=>a.number-b.number).slice(0,8).map(j=>`<div class="row"><span class="badge-no">${j.number}</span><div style="flex:1"><strong>${esc(j.title)}</strong><small>${fmt(j.date)} · ${esc(j.status||'offen')}</small></div></div>`).join('')||'<span class="muted">Noch keine Aufträge.</span>'}</div></article></div>`}
function crewView(){const m=data.members.find(x=>x.id===editingId)||{};return `<div class="grid"><article class="panel"><h2>${editingId?'Konto bearbeiten':'Konto anlegen'}</h2><div class="form-grid"><div class="field"><label>VORNAME</label><input id="first" value="${esc(m.firstName)}"></div><div class="field"><label>NACHNAME</label><input id="last" value="${esc(m.lastName)}"></div><div class="field"><label>BENUTZERNAME</label><input id="username" value="${esc(m.username)}" autocomplete="off"></div><div class="field"><label>PASSWORT</label><input id="password" type="text" value="${esc(m.password)}" autocomplete="off"></div><div class="field"><label>RANG</label><input id="rank" value="${esc(m.rank)}" placeholder="z. B. Chief Officer"></div><div class="field"><label>KABINE / ZIMMER</label><input id="room" value="${esc(m.room)}"></div><div class="field"><label>ANREISE</label><input id="arrival" type="date" value="${esc(m.arrival)}"></div><div class="field"><label>ABREISE</label><input id="departure" type="date" value="${esc(m.departure)}"></div><div class="field" style="grid-column:1/-1"><label>BERECHTIGUNGEN</label><input id="permissions" value="${esc((m.permissions||[]).join(', '))}" placeholder="Bridge, Safety, Maintenance"></div><div class="field" style="grid-column:1/-1"><label>NOTIZEN</label><textarea id="notes">${esc(m.notes)}</textarea></div></div><div class="password-note">Der Kapitän legt Benutzername und Passwort fest. Die aktuelle GitHub-Version ist keine sichere Server-Authentifizierung.</div><div class="actions"><button class="btn primary" id="saveMember">Speichern</button><button class="btn" id="clearMember">Neu</button></div></article><article class="panel"><h2>Besatzung / Konten</h2><div class="list">${data.members.map(x=>`<div class="row"><div><strong>${esc(x.firstName+' '+x.lastName)}</strong><small>${esc(x.rank||'—')} · ${fmt(x.arrival)} → ${fmt(x.departure)} · ${esc(x.username||'—')}</small><div class="chips">${(x.permissions||[]).map(p=>`<span class="chip">${esc(p)}</span>`).join('')}</div></div><div class="actions"><button class="btn" data-edit="${x.id}">Bearbeiten</button><button class="btn danger" data-del="${x.id}">Löschen</button></div></div>`).join('')}</div></article></div>`}
function tasksView(){return `<div class="grid"><article class="panel"><h2>Duty / Arbeitszeit planen</h2><div class="form-grid"><div class="field"><label>DATUM</label><input id="td" type="date"></div><div class="field"><label>START</label><input id="tt" type="time" value="08:00"></div><div class="field"><label>DAUER (h)</label><input id="duration" type="number" min="1" max="24" value="1"></div><div class="field"><label>KATEGORIE</label><select id="type"><option>Tank Cleaning</option><option>Maintenance</option><option>Watch</option><option>Manoeuvring</option><option>Other</option></select></div><div class="field"><label>WER?</label><select id="assignee">${data.members.map(m=>`<option value="${m.id}">${esc(m.firstName+' '+m.lastName)}</option>`).join('')}</select></div><div class="field"><label>SUPPORT</label><select id="support" multiple size="3">${data.members.map(m=>`<option value="${m.id}">${esc(m.firstName+' '+m.lastName)}</option>`).join('')}</select></div><div class="field" style="grid-column:1/-1"><label>AUFGABE</label><input id="task" placeholder="z. B. Tank 3 reinigen"></div><div class="field" style="grid-column:1/-1"><label>DETAILS</label><textarea id="detail" placeholder="Was genau ist zu tun? Mit wem? Besonderheiten?"></textarea></div></div><div class="actions"><button class="btn primary" id="saveTask">Duty speichern</button></div></article><article class="panel"><h2>Gespeicherte Duties</h2><div class="list">${data.tasks.map(t=>`<div class="row"><div><strong>${fmt(t.date)} · ${esc(t.time||'')} · ${esc(t.type)}</strong><small>${esc(t.title)} · ${esc(memberName(t.assignee))}${t.support?.length?' · Support: '+esc(t.support.map(memberName).join(', ')):''}</small><small>${esc(t.detail||'')}</small></div><button class="btn danger" data-task-del="${t.id}">Löschen</button></div>`).join('')||'<span class="muted">Keine Duties.</span>'}</div></article></div>`}
function eventsView(){return `<div class="grid"><article class="panel"><h2>Schiffsereignis</h2><div class="form-grid"><div class="field"><label>DATUM</label><input id="ed" type="date"></div><div class="field"><label>ZEIT</label><input id="et" type="time"></div><div class="field"><label>ART</label><select id="kind"><option>Ankunft</option><option>Abfahrt</option><option>Hafenwechsel</option><option>Sonstiges</option></select></div><div class="field"><label>HAFEN</label><input id="port"></div><div class="field" style="grid-column:1/-1"><label>DETAILS</label><textarea id="edetail" placeholder="Liegeplatz, Pilot, ETA/ETD, Aufgaben, Hinweise …"></textarea></div></div><div class="actions"><button class="btn primary" id="saveEvent">Ereignis speichern</button></div></article><article class="panel"><h2>Ankunft / Abfahrt</h2><div class="list">${data.events.map(e=>`<div class="row"><div><strong>${esc(e.kind)} · ${fmt(e.date)} ${esc(e.time||'')}</strong><small>${esc(e.port||'—')} · ${esc(e.detail||'')}</small></div><button class="btn danger" data-event-del="${e.id}">Löschen</button></div>`).join('')||'<span class="muted">Keine Ereignisse.</span>'}</div></article></div>`}
function today(){return new Date().toISOString().slice(0,10)}
function jobsView(){const next=Math.max(0,...data.jobs.map(j=>Number(j.number)||0))+1;return `<div class="grid"><article class="panel"><h2>Nächsten Auftrag vormerken</h2><p class="section-note">Die Nummer wird automatisch aufsteigend vergeben. Der Agent kann Aufträge im Crew-Portal ebenfalls vormerken; der Kapitän kann sie hier bearbeiten bzw. abschließen.</p><div class="form-grid"><div class="field"><label>AUFTRAGSNUMMER</label><input id="jobNo" type="number" min="1" value="${next}"></div><div class="field"><label>GEWÜNSCHTES DATUM</label><input id="jobDate" type="date"></div><div class="field" style="grid-column:1/-1"><label>AUFTRAG</label><input id="jobTitle" placeholder="z. B. Tank 4 inspizieren"></div><div class="field"><label>VERANTWORTLICH</label><select id="jobOwner"><option value="">Noch offen</option>${data.members.map(m=>`<option value="${m.id}">${esc(m.firstName+' '+m.lastName)}</option>`).join('')}</select></div><div class="field"><label>STATUS</label><select id="jobStatus"><option value="open">Offen</option><option value="planned">Geplant</option><option value="done">Erledigt</option></select></div><div class="field" style="grid-column:1/-1"><label>DETAILS / HINWEISE</label><textarea id="jobDetails"></textarea></div></div><div class="actions"><button class="btn primary" id="saveJob">Auftrag speichern</button></div></article><article class="panel"><h2>Auftragsliste</h2><div class="list">${[...data.jobs].sort((a,b)=>a.number-b.number).map(j=>`<div class="row"><span class="badge-no">${j.number}</span><div style="flex:1"><strong>${esc(j.title)}</strong><small>${fmt(j.date)} · ${esc(memberName(j.ownerId))} · ${esc(j.status||'open')}</small><small>${esc(j.details||'')}</small></div><div class="actions"><button class="btn" data-job-done="${j.id}">${j.status==='done'?'Erledigt':'Abschließen'}</button><button class="btn danger" data-job-del="${j.id}">Löschen</button></div></div>`).join('')||'<span class="muted">Keine Aufträge vorgemerkt.</span>'}</div></article></div>`}
function movementsView(){return `<div class="grid"><article class="panel"><h2>Crew An- und Abreise vormerken</h2><p class="section-note">Der Agent kann Datum und gewünschten Ort vorschlagen. Der Kapitän ergänzt später den tatsächlichen An- bzw. Abreiseort und bestätigt die Vormerkung.</p><div class="form-grid"><div class="field"><label>CREW-MITGLIED</label><select id="moveMember">${data.members.map(m=>`<option value="${m.id}">${esc(m.firstName+' '+m.lastName)}</option>`).join('')}</select></div><div class="field"><label>RICHTUNG</label><select id="moveDirection"><option value="join">Kommt an</option><option value="leave">Geht von Bord</option></select></div><div class="field"><label>DATUM</label><input id="moveDate" type="date"></div><div class="field"><label>VORGEMERKTER ORT</label><input id="movePlace" placeholder="z. B. Hamburg (Vorschlag)"></div><div class="field"><label>ZEIT / FLUG / INFO</label><input id="moveInfo" placeholder="Optional"></div><div class="field"><label>TATSÄCHLICHER ORT (KAPITÄN)</label><input id="moveActual" placeholder="Wird vom Kapitän bestätigt"></div><div class="field" style="grid-column:1/-1"><label>NOTIZ</label><textarea id="moveNote"></textarea></div></div><div class="actions"><button class="btn primary" id="saveMove">Reise vormerken</button></div></article><article class="panel"><h2>Vormerkungen & Kapitänsbestätigung</h2><div class="list">${[...data.movements].sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`<div class="row"><div style="flex:1"><strong>${m.direction==='join'?'Anreise':'Abreise'} · ${esc(memberName(m.memberId))}</strong><small>${fmt(m.date)} · Vorschlag: ${esc(m.proposedPlace||'—')}</small><small>Tatsächlicher Ort: ${esc(m.actualPlace||'noch nicht bestätigt')} · ${esc(m.info||'')}</small><small>${esc(m.note||'')}</small><span class="chip">${m.status==='confirmed'?'Vom Kapitän bestätigt':'Vorgemerkt / offen'}</span></div><div class="actions"><button class="btn" data-move-confirm="${m.id}">Ort bestätigen</button><button class="btn danger" data-move-del="${m.id}">Löschen</button></div></div>`).join('')||'<span class="muted">Keine Vormerkungen.</span>'}</div></article></div>`}
const defaultBridgeRows=[['','Pilot an Bord',''],['','Erste Leine an Land',''],['','Festgemacht',''],['','Gangway bereit',''],['','Ladearme angeschlossen',''],['','Ladebeginn','']];
function bridgeView(){const st=data.settings||{};return `<div class="grid"><article class="panel"><h2>Brückenprotokoll / Ankunft & Abfahrt</h2><p class="section-note">LT = Ortszeit des Schiffes. Die voreingestellten Zeilen können angepasst, entfernt oder durch eigene Ereignisse ergänzt werden. Das Speichern legt einen Datensatz mit Schiff, Reise-Nr. und UTC-Datum an.</p><div class="form-grid"><div class="field"><label>SCHIFFSNAME</label><input id="shipName" value="${esc(st.shipName||'CUNO ESSBERGER')}"></div><div class="field"><label>REISE-NR. / VOYAGE NO.</label><input id="voyageNo" value="${esc(st.voyageNumber||'')}" placeholder="z. B. 026"></div><div class="field"><label>DATUM (UTC)</label><input id="bridgeDate" type="date" value="${today()}"></div><div class="field"><label>EREIGNIS</label><select id="bridgeKind"><option>Ankunft</option><option>Abfahrt</option><option>Hafenwechsel</option><option>Sonstiges</option></select></div><div class="field"><label>HAFEN / ORT</label><input id="bridgePort" placeholder="Hafen / Terminal"></div><div class="field"><label>ZEITBASIS</label><select id="bridgeTimeBasis"><option value="LT">LT — Local Time</option><option value="UTC">UTC</option></select></div></div><h3 style="margin:18px 0 5px">Zeitlinie</h3><div id="bridgeRows">${defaultBridgeRows.map((r,i)=>bridgeRow(i,r[1],r[2])).join('')}</div><div class="actions"><button class="btn" id="addBridgeRow">+ Ereigniszeile einfügen</button><button class="btn primary" id="saveBridge">Protokoll speichern</button></div></article><article class="panel"><h2>Gespeicherte Protokolle</h2><div class="list">${[...data.bridgeLogs].sort((a,b)=>b.savedAt.localeCompare(a.savedAt)).map(l=>`<div class="row"><div style="flex:1"><strong>${esc(l.fileName)}</strong><small>${esc(l.kind)} · ${esc(l.port||'—')} · ${esc(l.timeBasis)} · ${fmt(l.dateUTC)}</small><small>${l.rows.map(r=>`${esc(r.time||'--:--')} ${esc(r.name)}${r.note?' — '+esc(r.note):''}`).join(' · ')}</small></div><div class="actions"><button class="btn" data-bridge-export="${l.id}">JSON</button><button class="btn danger" data-bridge-del="${l.id}">Löschen</button></div></div>`).join('')||'<span class="muted">Noch keine Protokolle gespeichert.</span>'}</div></article></div>`}
function bridgeRow(i,name='',note=''){return `<div class="bridge-row" data-bridge-row><input type="time" aria-label="Zeit LT/UTC" value="" class="br-time"><input type="text" aria-label="Ereignisname" class="br-name" value="${esc(name)}" placeholder="Ereignis / Name"><input type="text" aria-label="Bemerkung" class="br-note" value="${esc(note)}" placeholder="Bemerkung (optional)"><button class="btn bridge-remove" type="button" data-remove-bridge>Entfernen</button></div>`}

ue.trim(),info:document.getElementById('moveInfo').value.trim(),actualPlace:document.getElementById('moveActual').value.trim(),note:document.getElementById('moveNote').value.trim(),status:'pending',createdAt:new Date().toISOString()};if(!m.memberId||!m.date)return alert('Crew-Mitglied und Datum sind erforderlich.');data.movements.push(m);sync();renderView()});document.getElementById('addBridgeRow')?.addEventListener('click',()=>{const box=document.getElementById('bridgeRows');box.insertAdjacentHTML('beforeend',bridgeRow(box.children.length,'',''))});document.querySelectorAll('[data-remove-bridge]').forEach(b=>b.onclick=()=>b.closest('[data-bridge-row]').remove());document.getElementById('saveBridge')?.addEventListener('click',()=>{const ship=document.getElementById('shipName').value.trim();const voyage=document.getElementById('voyageNo').value.trim();const date=document.getElementById('bridgeDate').value;if(!ship||!voyage||!date)return alert('Schiffsname, Reise-Nr. und UTC-Datum sind erforderlich.');const rows=[...document.querySelectorAll('[data-bridge-row]')].map(r=>({time:r.querySelector('.br-time').value,name:r.querySelector('.br-name').value.trim(),note:r.querySelector('.br-note').value.trim()})).filter(r=>r.name||r.time||r.note);const d=new Date(date+'T00:00:00Z');const dateLabel=String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')+'.'+d.getUTCFullYear();const safe=s=>s.replace(/[^a-z0-9_-]+/gi,'_');const log={id:'bridge-'+Date.now(),shipName:ship,voyageNumber:voyage,dateUTC:date,kind:document.getElementById('bridgeKind').value,port:document.getElementById('bridgePort').value.trim(),timeBasis:document.getElementById('bridgeTimeBasis').value,rows,savedAt:new Date().toISOString(),fileName:`${safe(ship)}_${safe(voyage)}_${dateLabel}`};data.settings={...(data.settings||{}),shipName:ship,voyageNumber:voyage};data.bridgeLogs.push(log);sync();renderView();alert('Brückenprotokoll gespeichert: '+log.fileName)});document.querySelectorAll(
