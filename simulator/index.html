<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Steering Simulator · NavTool</title><link rel="icon" href="/pic/allgemein/icon-192.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/assets/navtool-global.css"></head><body>
<header>
<a class="lg" href="/" aria-label="NavTool Start"><img src="/pic/allgemein/logo.png" alt="NavTool"></a>
<button id="pr">Üben</button>
<div id="opts" hidden>
<select id="focus"><option value="steer">Nur Steuern</option><option value="tele">Nur Telegraf</option><option value="both">Beides</option></select>
<select id="lvl"><option value="3">Anfänger ±3°</option><option value="1" selected>Standard ±1°</option><option value="0.5">Experte ±0,5°</option></select>
</div>
<div id="cmd">Freie Fahrt</div><div id="stat"></div>
</header>
<main>
<section id="L"><canvas id="gy" width="600" height="600"></canvas>
<div class="row"><div><small>Rate of Turn</small><b id="rot">0.0</b><small>°/min</small></div><div><small>Fahrt</small><b id="spd">0.0</b><small>kn</small></div></div></section>
<section id="C"><canvas id="rd" width="440" height="120"></canvas>
<svg id="wh" viewBox="-200 -200 400 400"><circle r="96" fill="#0f1114" stroke="#3a4048" stroke-width="3"/><g id="tk"></g>
<g id="wg"><path d="M-130-80A153 153 0 1 0 130-80" fill="none" stroke="#08090b" stroke-width="44" stroke-linecap="round"/>
<path d="M-130-80A153 153 0 1 0 130-80" fill="none" stroke="#2b3037" stroke-width="3" transform="translate(0 -10)"/>
<rect x="-28" y="94" width="56" height="44" rx="10" fill="#08090b"/><path d="M-10-112h20l-10 24z" fill="#e8453c"/></g></svg>
<button id="mid">Mittschiffs</button></section>
<section id="R"><small>Maschinentelegraf</small><div id="tg"></div></section>
</main>
<div id="warn">Bitte das Gerät quer drehen</div>
<script src="/assets/navtool-global.js"></script><script src="app.js"></script></body></html>
