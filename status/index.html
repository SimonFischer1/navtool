<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status · NavTool</title><meta name="theme-color" content="#05090c">
<link rel="icon" href="/pic/allgemein/icon-192.png"><link rel="stylesheet" href="/assets/navtool-global.css">
<style>body{margin:0;background:#05090c;color:#ecfbf9;font-family:Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh}
main{width:min(900px,100% - 32px);margin:0 auto;padding:54px 0 20px}h1{font-size:clamp(36px,6vw,60px);letter-spacing:-.05em;line-height:1}
.ov{margin:24px 0;padding:18px 20px;border-radius:16px;border:1px solid rgba(85,229,209,.3);background:rgba(10,21,27,.82);font-weight:800}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;padding:16px 18px;margin-top:10px;border:1px solid rgba(85,229,209,.13);border-radius:14px;background:rgba(10,21,27,.82);text-decoration:none;color:inherit}
.row:hover{border-color:rgba(85,229,209,.4)}.row b{font-size:15px;letter-spacing:.08em}.row small{grid-column:1/-1;color:#7e9697;line-height:1.5}
.pill{padding:6px 12px;border-radius:99px;font-size:10px;font-weight:900;letter-spacing:.1em}.p-aktiv{background:rgba(63,220,126,.14);color:#3fdc7e}.p-stoerung{background:rgba(255,112,112,.15);color:#ff7070}.p-wartung,.p-planung{background:rgba(255,209,102,.14);color:#ffd166}.p-aus{background:rgba(126,150,151,.18);color:#9ab1b1}
.up{margin-top:18px;color:#587071;font-size:12px}</style></head><body>
<main><div style="color:#55e5d1;font-size:10px;font-weight:900;letter-spacing:.2em">NAVTOOL STATUS</div><h1>Was läuft gerade?</h1>
<div class="ov" id="ov">Lade Status …</div><div id="list"></div><p class="up" id="up"></p></main>
<script src="/assets/navtool-global.js"></script>
<script>const L={aktiv:'Aktiv',stoerung:'Störung',wartung:'Wartung',planung:'In Planung',aus:'Abgeschaltet'};
async function load(){try{const c=await(await fetch('/data/config.json?'+Date.now(),{cache:'no-store'})).json();
const ms=c.modules.map(m=>({...m,k:m.enabled?m.status:'aus'}));const bad=ms.some(m=>m.k==='stoerung'),warn=ms.some(m=>m.k!=='aktiv');
ov.innerHTML=`<i class="nt-dot ${bad?'bad':warn?'warn':''}"></i>${bad?'Es gibt aktuell eine Störung.':warn?'Einzelne Bereiche sind in Wartung, Planung oder abgeschaltet.':'Alle Bereiche laufen normal.'}`;
list.innerHTML=ms.map(m=>`<a class="row" href="${m.path}"><b>${m.name}</b><span class="pill p-${m.k}">${L[m.k]}</span>${m.note?`<small>${m.note.replace(/</g,'&lt;')}</small>`:''}${(m.sections||[]).some(s=>!s.enabled)?`<small>Ausgeblendet: ${m.sections.filter(s=>!s.enabled).map(s=>s.name).join(', ')}</small>`:''}</a>`).join('');
up.textContent='Zuletzt aktualisiert: '+new Date(c.updated).toLocaleString('de-DE')}catch(e){ov.textContent='Status konnte nicht geladen werden. Bist du offline?'}}
load();setInterval(load,60000)</script></body></html>
